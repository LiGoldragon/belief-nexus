[package]
name = "emission-belief-nexus"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-belief-nexus/datom", "meta-signal-belief-nexus/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "d77169d", default-features = false }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "c388b11", default-features = false }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "baf8ce0", default-features = false }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
