[package]
name = "belief-nexus-translator"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "d77169d", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "27da70f", features = ["text", "unix"] }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "c388b11", features = ["datom"] }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "baf8ce0", features = ["datom"] }
emission-belief-nexus = { path = "../emission", features = ["datom"] }
nix = { version = "0.30", features = ["socket", "user", "signal", "process"] }

[dev-dependencies]
tempfile = "3"
