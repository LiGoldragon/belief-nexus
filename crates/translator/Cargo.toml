[package]
name = "belief-nexus-translator"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "e26d90ff185d54bc0007b19a8d9bc390c6bfeb12" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "c38b0529437ae452c7047c6ace920c58e4c1f0fc", features = ["text"] }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "ddb5fc6b53f9e976ae5097a0637d6dbfd01ae609", features = ["datom"] }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "3d9f3f0357b56322dcd28624b03bcd106f8ef939", features = ["datom"] }
emission-belief-nexus = { path = "../emission", features = ["datom"] }
nix = { version = "0.30", features = ["socket", "user"] }

[dev-dependencies]
tempfile = "3"
