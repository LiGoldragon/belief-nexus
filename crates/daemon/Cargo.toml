[package]
name = "belief-nexus-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
belief-nexus-core = { path = "../core" }
emission-belief-nexus = { path = "../emission" }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "d28c8e0d98109bc1ad04cc0b8e2cb39a37f447bf" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "d22d6662a868b78e110bb9c63638c70298ac3c98" }

[dev-dependencies]
tempfile = "3"
