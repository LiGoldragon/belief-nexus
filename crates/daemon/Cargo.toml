[package]
name = "belief-nexus-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
belief-nexus-core = { path = "../core" }
emission-belief-nexus = { path = "../emission" }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "3d9f3f0357b56322dcd28624b03bcd106f8ef939" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "ddb5fc6b53f9e976ae5097a0637d6dbfd01ae609" }

[dev-dependencies]
tempfile = "3"
