[package]
name = "belief-nexus-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
belief-nexus-core = { path = "../core" }
emission-belief-nexus = { path = "../emission" }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "cd2788c4855ce57ca3ba20004ac2178e558ee3d4" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "0cad1d1aeddec7da2971dc88e964320a6db48c20", default-features = false }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "6101af90d66517da3f71605a22451de8ccc981c7" }

[dev-dependencies]
tempfile = "3"
