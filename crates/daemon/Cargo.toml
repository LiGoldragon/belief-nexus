[package]
name = "belief-nexus-daemon"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
belief-nexus-core = { path = "../core" }
emission-belief-nexus = { path = "../emission" }
meta-signal-belief-nexus = { git = "https://github.com/LiGoldragon/meta-signal-belief-nexus", rev = "baf8ce0" }
nix = { version = "0.30", features = ["socket", "user"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "d77169d", default-features = false }
signal-belief-nexus = { git = "https://github.com/LiGoldragon/signal-belief-nexus", rev = "c388b11" }
translator = { git = "https://github.com/LiGoldragon/translator", rev = "27da70f", features = ["unix"] }

[dev-dependencies]
tempfile = "3"
belief-nexus-translator = { path = "../translator" }

[lints.clippy]
# wire::Response is the contract's own reply, returned whole.
result_large_err = "allow"
